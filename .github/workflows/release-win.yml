name: Release Windows EXE

run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate immutable release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$packageVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "태그($env:GITHUB_REF_NAME)와 package.json 버전($expectedTag)이 일치하지 않습니다."
          }

          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "동일 버전의 GitHub Release가 이미 존재합니다. 기존 자산을 덮어쓸 수 없습니다."
          }
          $global:LASTEXITCODE = 0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Windows EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:win

      - name: Create SHA256SUMS.txt
        run: |
          $exe = Get-ChildItem dist/*.exe
          if ($exe.Count -ne 1) {
            throw "릴리스할 EXE가 정확히 1개여야 합니다. 현재: $($exe.Count)개"
          }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Out-File dist/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Attest Windows executable
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: dist/*.exe

      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          $fullNotes = Get-Content RELEASE_NOTES.md -Raw
          $currentNotes = ($fullNotes -split '\r?\n---')[0].Trim()
          $currentNotes | Out-File current_release.md -Encoding utf8NoBOM
          gh release create $env:GITHUB_REF_NAME `
            $exe.FullName `
            dist/SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "EduNote $env:GITHUB_REF_NAME" `
            --notes-file current_release.md `
            --latest
