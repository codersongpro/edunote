name: Build Windows EXE

run-name: Release ${{ github.ref_name }}

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'RELEASE_NOTES.md'
      - 'electron-builder.yml'
      - 'electron.vite.config.ts'
      - 'src/**'
      - 'build/**'
      - '.github/workflows/build-win.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Windows EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:win

      - name: Get version
        id: pkg
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.pkg.outputs.version }}
        run: |
          $releaseName = "EduNote $env:TAG_NAME"
          $fullNotes = Get-Content RELEASE_NOTES.md -Raw
          $currentNotes = ($fullNotes -split '\r?\n---')[0].Trim()
          $currentNotes | Out-File -FilePath current_release.md -Encoding utf8
          gh release view $env:TAG_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG_NAME dist/*.exe --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit $env:TAG_NAME --repo $env:GITHUB_REPOSITORY --title $releaseName --notes-file current_release.md --latest
          } else {
            gh release create $env:TAG_NAME dist/*.exe --repo $env:GITHUB_REPOSITORY --title $releaseName --notes-file current_release.md --latest
          }
