name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:win

      - name: Get version
        id: pkg
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: 에듀노트 v${{ steps.pkg.outputs.version }}
          body: |
            ## 에듀노트 v${{ steps.pkg.outputs.version }}

            ### 설치 방법
            1. 아래 Assets에서 `에듀노트_*.exe` 파일을 다운로드합니다.
            2. 다운로드한 EXE 파일을 실행합니다. (설치 불필요)
            3. 설정에서 Gemini API 키를 입력하면 바로 사용 가능합니다.

            ### Gemini API 키 발급
            [aistudio.google.com](https://aistudio.google.com) 에서 무료로 발급받을 수 있습니다.
          draft: false
          prerelease: false
          files: dist/*.exe
          make_latest: true
