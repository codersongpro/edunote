<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="white" stroke="black" stroke-width="28"/>

  <!-- AI text -->
  <text x="180" y="310" font-family="Arial Black, Arial" font-weight="900" font-size="220" fill="#00C9B1" text-anchor="middle">A</text>
  <text x="340" y="310" font-family="Arial Black, Arial" font-weight="900" font-size="220" fill="#00C9B1" text-anchor="middle">I</text>

  <!-- Pencil body (diagonal) -->
  <g transform="translate(404, 246) scale(-1, 1) rotate(-45)">
    <rect x="-18" y="-90" width="36" height="140" rx="4" fill="white" stroke="black" stroke-width="14"/>
    <rect x="-18" y="-90" width="36" height="40" rx="4" fill="#00C9B1"/>
    <!-- Pencil tip -->
    <polygon points="-18,50 18,50 0,90" fill="white" stroke="black" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="-8,60 8,60 0,80" fill="#00C9B1"/>
    <!-- Eraser line -->
    <line x1="-18" y1="30" x2="18" y2="30" stroke="black" stroke-width="14"/>
  </g>

  <!-- Bottom line under pencil -->
  <line x1="295" y1="450" x2="460" y2="450" stroke="black" stroke-width="28" stroke-linecap="round"/>
</svg>
