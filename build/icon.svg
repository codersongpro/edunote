<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Main document body -->
  <rect x="30" y="18" width="408" height="462" rx="20" ry="20" fill="#8DDEDE" stroke="#111" stroke-width="16"/>

  <!-- Right binding tab -->
  <rect x="392" y="100" width="78" height="222" rx="10" ry="10" fill="#00C8C8" stroke="#111" stroke-width="14"/>

  <!-- White header stripe -->
  <rect x="44" y="28" width="380" height="52" rx="5" ry="5" fill="white"/>

  <!-- Bottom curved base -->
  <rect x="18" y="454" width="464" height="44" rx="22" ry="22" fill="#00AABB" stroke="#111" stroke-width="14"/>

  <!-- "Ai" text -->
  <text x="210" y="195"
        font-family="'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-size="132"
        fill="#111"
        text-anchor="middle">Ai</text>

  <!-- Pen nib - yellow hexagonal body -->
  <polygon points="60,330 146,282 328,282 368,330 328,378 146,378"
           fill="#FFD000" stroke="#111" stroke-width="14" stroke-linejoin="round"/>

  <!-- Teal circle in nib center -->
  <circle cx="216" cy="330" r="28" fill="#00C8C8" stroke="#111" stroke-width="12"/>

  <!-- Gray connector piece -->
  <rect x="328" y="308" width="42" height="44" fill="#CCCCCC" stroke="#111" stroke-width="12"/>

  <!-- Cyan pen barrel -->
  <rect x="366" y="300" width="96" height="60" rx="8" ry="8" fill="#00C0FF" stroke="#111" stroke-width="14"/>
</svg>
