appId: com.edunote.app
productName: EduNote
copyright: Copyright 2026

directories:
  buildResources: build
  output: dist

files:
  - out/**/*

win:
  icon: build/icon.ico
  target:
    - target: portable
      arch:
        - x64
  artifactName: edunote_${version}.exe

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

portable:
  artifactName: edunote_${version}_portable.exe
