<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>EduNote 채팅방</title>
<style>
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard, sans-serif; margin: 0; background: #FAF9F7; color: #1C1917; overflow: hidden; font-size: 16px; }
  #app { max-width: 480px; margin: 0 auto; padding: 16px; height: 100vh; height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  #closedBanner { display: none; background: #FEF3C7; color: #92400E; padding: 10px 14px; border-radius: 8px; font-size: 15px; margin-bottom: 8px; }
  #pinnedBanner { display: none; background: #FFFBEB; border: 1px solid #FDE68A; color: #92400E; padding: 10px 14px; border-radius: 8px; font-size: 15px; margin-bottom: 8px; }
  #pinnedBanner .pinnedSender { font-weight: bold; font-size: 13px; margin-bottom: 2px; }
  #nickGate { display: flex; flex-direction: column; gap: 12px; margin-top: 40px; }
  #chatArea { display: none; flex: 1; flex-direction: column; min-height: 0; }
  #endedScreen { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; padding: 24px; }
  #endedScreen .endedIcon { font-size: 40px; }
  #endedScreen .endedTitle { font-size: 20px; font-weight: bold; color: #1C1917; }
  #endedScreen .endedDesc { font-size: 16px; color: #78716C; line-height: 1.5; }
  #messages { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 0; }
  .msg { border: 1px solid #EDE8E1; border-radius: 10px; padding: 10px 14px; max-width: 80%; align-self: flex-start; font-size: 16px; line-height: 1.45; }
  .msg.mine { border: none; align-self: flex-end; }
  .msg .sender { font-size: 13px; color: #A8A29E; margin-bottom: 2px; }
  #composer { display: flex; gap: 8px; padding: 10px 0; border-top: 1px solid #EDE8E1; }
  input[type=text] { flex: 1; padding: 14px; border: 1px solid #E7E5E4; border-radius: 8px; font-size: 17px; box-sizing: border-box; }
  button { background: #F59E0B; color: #fff; border: none; border-radius: 8px; padding: 14px 18px; font-size: 17px; cursor: pointer; }
  button:disabled { background: #D6D3D1; cursor: default; }
  #joinError { color: #DC2626; font-size: 15px; min-height: 16px; }
</style>
</head>
<body>
<div id="app">
  <h1>EduNote 채팅방</h1>
  <div id="closedBanner">선생님이 채팅방을 종료했습니다. 더 이상 메시지를 보낼 수 없습니다.</div>
  <div id="pinnedBanner"><div class="pinnedSender"></div><div id="pinnedText"></div></div>
  <div id="endedScreen">
    <div class="endedIcon">🔒</div>
    <div class="endedTitle">채팅방이 종료되었습니다</div>
    <div class="endedDesc">선생님이 채팅방을 종료했습니다.<br>더 이상 참여할 수 없습니다.</div>
  </div>
  <div id="nickGate">
    <input type="text" id="nickInput" placeholder="닉네임을 입력하세요" maxlength="20">
    <button id="joinBtn">입장하기</button>
    <p id="joinError"></p>
  </div>
  <div id="chatArea">
    <div id="messages"></div>
    <div id="composer">
      <input type="text" id="textInput" placeholder="메시지를 입력하세요" maxlength="500">
      <button id="sendBtn">전송</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function () {
  // 입력창을 항상 화면 맨 아래(키보드 위)에 고정한다. 모바일은 키보드가 올라와도 100dvh가 줄지 않아
  // 입력창이 키보드에 가려지거나, 일부 태블릿 브라우저에서 100dvh가 실제 보이는 높이와 달라 입력창이
  // 화면 밖으로 밀려 스크롤해야 보이는 문제가 있다. 그래서 실제로 보이는 영역(visualViewport)의 높이·
  // 위치에 맞춰 앱 높이를 직접 조정해, 입력창이 늘 화면 맨 아래에 보이도록 한다.
  function fitAppHeight() {
    var app = document.getElementById('app');
    if (!app) return;
    var vv = window.visualViewport;
    if (vv) {
      app.style.height = vv.height + 'px';
      app.style.transform = 'translateY(' + vv.offsetTop + 'px)';
    } else {
      app.style.height = window.innerHeight + 'px';
    }
  }
  fitAppHeight();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitAppHeight);
    window.visualViewport.addEventListener('scroll', fitAppHeight);
  }
  window.addEventListener('resize', fitAppHeight);
  window.addEventListener('orientationchange', fitAppHeight);

  var hash = location.hash.replace(/^#/, '');
  var params = new URLSearchParams(hash);
  var roomId = params.get('room');
  var cfgRaw = params.get('cfg');
  var joinError = document.getElementById('joinError');
  var joinBtn = document.getElementById('joinBtn');

  if (!roomId || !cfgRaw) {
    joinError.textContent = '잘못된 접속 주소입니다. QR코드를 다시 스캔해주세요.';
    joinBtn.disabled = true;
    return;
  }

  // 같은 기기(브라우저)에서 같은 채팅방에 중복으로 접속하는 것을 막는다.
  // 탭끼리는 localStorage를 통해서만 서로를 알 수 있으므로, 다른 브라우저·다른 기기까지는 감지하지 못한다.
  var DEVICE_LOCK_KEY = 'edunote-chat-lock-' + roomId;
  var DEVICE_LOCK_TIMEOUT_MS = 8000;
  var deviceTabId = Date.now() + '-' + Math.random().toString(36).slice(2);
  var isPrimaryTab = false;
  var lockHeartbeatTimer = null;

  function readDeviceLock() {
    try { return JSON.parse(localStorage.getItem(DEVICE_LOCK_KEY) || 'null'); } catch (e) { return null; }
  }

  function claimDeviceLock() {
    localStorage.setItem(DEVICE_LOCK_KEY, JSON.stringify({ tabId: deviceTabId, ts: Date.now() }));
    isPrimaryTab = true;
    lockHeartbeatTimer = setInterval(function () {
      localStorage.setItem(DEVICE_LOCK_KEY, JSON.stringify({ tabId: deviceTabId, ts: Date.now() }));
    }, 3000);
  }

  function blockDeviceAccess() {
    isPrimaryTab = false;
    if (lockHeartbeatTimer) clearInterval(lockHeartbeatTimer);
    joinError.textContent = '이미 이 기기(같은 브라우저)에서 채팅방에 접속해 있습니다. 다른 탭이나 창을 닫고 새로고침해주세요.';
    joinBtn.disabled = true;
  }

  var existingDeviceLock = readDeviceLock();
  if (existingDeviceLock && existingDeviceLock.tabId !== deviceTabId && (Date.now() - existingDeviceLock.ts) < DEVICE_LOCK_TIMEOUT_MS) {
    blockDeviceAccess();
    return;
  }
  claimDeviceLock();

  // 다른 탭이 거의 동시에 잠금을 가져가면(드문 경쟁 상황) storage 이벤트로 알아채고 이 탭을 막는다.
  window.addEventListener('storage', function (e) {
    if (e.key !== DEVICE_LOCK_KEY || !isPrimaryTab) return;
    var lock = readDeviceLock();
    if (lock && lock.tabId !== deviceTabId) blockDeviceAccess();
  });

  window.addEventListener('beforeunload', function () {
    if (!isPrimaryTab) return;
    clearInterval(lockHeartbeatTimer);
    var lock = readDeviceLock();
    if (lock && lock.tabId === deviceTabId) localStorage.removeItem(DEVICE_LOCK_KEY);
  });

  var config;
  try {
    config = JSON.parse(atob(decodeURIComponent(cfgRaw)));
  } catch (e) {
    joinError.textContent = '접속 정보를 읽을 수 없습니다. QR코드를 다시 스캔해주세요.';
    joinBtn.disabled = true;
    return;
  }

  firebase.initializeApp(config);
  var auth = firebase.auth();
  var db = firebase.firestore();
  // 학교망 등 프록시가 실시간 스트리밍(WebChannel)을 버퍼링해 메시지가 즉시 도착하지 않는 문제가 있어,
  // 변경마다 독립적인 요청/응답으로 주고받는 롱폴링을 강제한다. (다른 Firestore 작업보다 먼저 호출해야 한다.)
  db.settings({ experimentalForceLongPolling: true });
  var roomRef = db.collection('rooms').doc(roomId);
  var messagesRef = roomRef.collection('messages');

  var nickname = '';
  var uid = null;
  var closed = false;
  var messagesEl = document.getElementById('messages');
  var textInput = document.getElementById('textInput');
  var sendBtn = document.getElementById('sendBtn');
  var closedBanner = document.getElementById('closedBanner');
  var nickGate = document.getElementById('nickGate');
  var chatArea = document.getElementById('chatArea');
  var endedScreen = document.getElementById('endedScreen');

  // 로그인 화면 없이 익명으로 인증해, 보안 규칙이 "나에게 온 귓속말"을 구분할 수 있게 한다.
  joinBtn.disabled = true;
  auth.onAuthStateChanged(function (user) {
    if (user) {
      uid = user.uid;
      joinBtn.disabled = false;
    }
  });
  auth.signInAnonymously().catch(function () {
    joinError.textContent = '접속 인증에 실패했습니다. 새로고침 후 다시 시도해주세요.';
  });

  var URL_PATTERN = /((?:https?:\/\/|www\.)\S+)/gi;

  function appendLinkifiedText(container, text, mine) {
    text.split(URL_PATTERN).forEach(function (part) {
      if (!part) return;
      if (/^(?:https?:\/\/|www\.)/i.test(part)) {
        var a = document.createElement('a');
        a.href = part.indexOf('http') === 0 ? part : 'https://' + part;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.style.color = mine ? '#fff' : '#D97706';
        a.style.wordBreak = 'break-all';
        a.textContent = part;
        container.appendChild(a);
      } else {
        container.appendChild(document.createTextNode(part));
      }
    });
  }

  // 보낸 사람 이름마다 같은 색이 나오도록(카카오톡처럼) 이름을 해시해 고정된 색을 골라준다.
  var BUBBLE_COLORS = [
    { bg: '#DBEAFE', text: '#1E3A8A' },
    { bg: '#D1FAE5', text: '#065F46' },
    { bg: '#EDE9FE', text: '#5B21B6' },
    { bg: '#FCE7F3', text: '#9D174D' },
    { bg: '#CFFAFE', text: '#155E75' },
    { bg: '#FFEDD5', text: '#9A3412' },
    { bg: '#ECFCCB', text: '#3F6212' },
    { bg: '#E0E7FF', text: '#3730A3' },
  ];

  function colorForSender(sender) {
    var hash = 0;
    for (var i = 0; i < sender.length; i++) hash = (hash * 31 + sender.charCodeAt(i)) >>> 0;
    return BUBBLE_COLORS[hash % BUBBLE_COLORS.length];
  }

  function renderMessage(data) {
    // 귓속말(to: 받는 사람들의 uid 배열)은 보안 규칙이 그 배열에 포함된 사람과 선생님에게만 전달해주지만,
    // 혹시를 대비해 화면에서도 한 번 더 내 것이 아니면 표시하지 않는다.
    var isWhisper = Array.isArray(data.to) && data.to.length > 0;
    if (isWhisper && data.to.indexOf(uid) === -1) return;
    var sender = data.sender || '익명';
    var mine = !!nickname && sender === nickname && !isWhisper;
    var div = document.createElement('div');
    div.className = 'msg' + (mine ? ' mine' : '');
    if (mine) {
      div.style.background = '#F59E0B';
      div.style.color = '#fff';
    } else {
      var c = isWhisper ? { bg: '#EDE9FE', text: '#5B21B6' } : colorForSender(sender);
      div.style.background = c.bg;
      div.style.color = c.text;
      var senderEl = document.createElement('div');
      senderEl.className = 'sender';
      senderEl.textContent = isWhisper ? '🔒 ' + sender + ' (나에게만 보이는 귓속말)' : sender;
      div.appendChild(senderEl);
    }
    var textEl = document.createElement('div');
    appendLinkifiedText(textEl, data.text || '', mine);
    div.appendChild(textEl);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setClosedState(value) {
    closed = value;
    textInput.disabled = closed;
    sendBtn.disabled = closed;
    if (closed) {
      // 종료되면 입장 화면·채팅·공지를 모두 숨기고 전체 "종료됨" 화면으로 잠가 학생을 사실상 퇴장시킨다.
      nickGate.style.display = 'none';
      chatArea.style.display = 'none';
      pinnedBanner.style.display = 'none';
      closedBanner.style.display = 'none';
      endedScreen.style.display = 'flex';
    } else {
      endedScreen.style.display = 'none';
      closedBanner.style.display = 'none';
      // 아직 입장 전이면 닉네임 화면을, 입장 후면 채팅 화면을 보여준다.
      nickGate.style.display = nickname ? 'none' : 'flex';
      chatArea.style.display = nickname ? 'flex' : 'none';
    }
  }

  var pinnedBanner = document.getElementById('pinnedBanner');
  var pinnedText = document.getElementById('pinnedText');

  function setPinnedState(pinned) {
    // 종료 상태에서는 전체 종료 화면만 보이도록 공지 배너를 숨긴다.
    if (closed || !pinned) {
      pinnedBanner.style.display = 'none';
      return;
    }
    pinnedBanner.querySelector('.pinnedSender').textContent = '📌 공지 · ' + (pinned.sender || '선생님');
    pinnedText.innerHTML = '';
    appendLinkifiedText(pinnedText, pinned.text || '', false);
    pinnedBanner.style.display = 'block';
  }

  // 닉네임 입력 전(입장 전)에도 방 제목을 바로 보여줄 수 있도록, 로그인 여부와 상관없이 즉시 구독한다.
  roomRef.onSnapshot(function (snap) {
    var data = snap.data();
    // 방이 종료(closed)됐거나 방 자체가 삭제돼 없어진 경우 모두 "종료" 상태로 잠가, 교사가 채팅방을
    // 끝낸 뒤(또는 지운 뒤) 학생끼리 다시 대화하지 못하게 한다.
    setClosedState(!snap.exists() || !!(data && data.closed));
    setPinnedState(data && data.pinnedMessage);
    if (data && data.title) document.querySelector('h1').textContent = data.title;
  });

  // Firestore 보안 규칙은 쿼리 결과 전체가 항상 안전하다는 것을 쿼리 구조만으로 증명할 수 없으면
  // 쿼리 자체를 거부한다. 그래서 "공개 메시지"와 "나에게 온 귓속말"을 각각 규칙과 정확히 일치하는
  // 조건(where)으로 따로 구독한 뒤, 결과를 합쳐서 시간순으로 보여준다.
  // 주의: where(필터)와 orderBy(다른 필드 정렬)를 함께 쓰면 복합 색인(composite index)이 필요해
  // 색인이 없으면 쿼리가 통째로 실패한다. 그래서 정렬은 서버(orderBy)가 아니라 아래 renderAllMessages에서
  // createdAt 기준으로 직접 하고, 쿼리에는 where 조건만 남겨 추가 색인 없이 동작하게 한다.
  var publicMessages = [];
  var whisperMessages = [];
  // 공개 메시지 구독과 귓속말 구독의 오류를 따로 추적한다. (하나가 성공할 때 다른 하나의 오류 안내가
  // 지워져 가려지지 않도록 분리한다.)
  var publicError = '';
  var whisperError = '';

  function messageSortKey(data) {
    // 방금 보낸 메시지는 createdAt(서버 시각)이 아직 확정되지 않아 null이다. 이때 0을 쓰면 목록 맨 위로
    // 올라가 화면 밖으로 밀려서 "다음 메시지를 보내야 직전 메시지가 보이는" 현상이 생긴다. 그래서 현재
    // 시각으로 취급해 맨 아래(가장 최신)에 바로 보이게 하고, 서버 시각이 확정되면 그 값으로 다시 정렬한다.
    return data.createdAt && typeof data.createdAt.toMillis === 'function' ? data.createdAt.toMillis() : Date.now();
  }

  function renderAllMessages() {
    var all = publicMessages.concat(whisperMessages);
    all.sort(function (a, b) { return messageSortKey(a) - messageSortKey(b); });
    messagesEl.innerHTML = '';
    var listenError = publicError || whisperError;
    if (listenError) {
      var errEl = document.createElement('div');
      errEl.className = 'msg';
      errEl.style.background = '#FEE2E2';
      errEl.style.color = '#991B1B';
      errEl.textContent = listenError;
      messagesEl.appendChild(errEl);
    }
    all.forEach(renderMessage);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function startListening() {
    messagesRef.where('to', '==', null).onSnapshot(function (snap) {
      publicError = '';
      publicMessages = snap.docs.map(function (doc) { return doc.data(); });
      renderAllMessages();
    }, function (err) {
      publicError = '공개 메시지를 불러오지 못했습니다 (' + ((err && err.code) || '오류') + '). 선생님이 최신 Firebase 보안 규칙을 다시 게시했는지 확인해주세요.';
      renderAllMessages();
    });
    messagesRef.where('to', 'array-contains', uid).onSnapshot(function (snap) {
      whisperError = '';
      whisperMessages = snap.docs.map(function (doc) { return doc.data(); });
      renderAllMessages();
    }, function (err) {
      whisperError = '귓속말을 불러오지 못했습니다 (' + ((err && err.code) || '오류') + '). 선생님이 최신 Firebase 보안 규칙을 다시 게시했는지 확인해주세요.';
      renderAllMessages();
    });
  }

  joinBtn.onclick = function () {
    var val = document.getElementById('nickInput').value.trim();
    if (!val) { joinError.textContent = '닉네임을 입력해주세요.'; return; }
    if (!uid) { joinError.textContent = '접속 인증 중입니다. 잠시 후 다시 시도해주세요.'; return; }
    nickname = val.slice(0, 20);
    document.getElementById('nickGate').style.display = 'none';
    document.getElementById('chatArea').style.display = 'flex';
    roomRef.collection('participants').doc(uid).set({
      nickname: nickname,
      joinedAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
    });
    // 선생님 화면에 "접속 중"으로 보이도록 주기적으로 접속 신호를 갱신한다.
    setInterval(function () {
      roomRef.collection('participants').doc(uid).update({
        lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
      });
    }, 20000);
    startListening();
  };

  function sendText() {
    var text = textInput.value.trim();
    if (!text || closed) return;
    textInput.value = '';
    messagesRef.add({
      sender: nickname,
      text: text,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      senderUid: uid,
      to: null,
    });
  }

  sendBtn.onclick = sendText;
  textInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') sendText();
  });
})();
</script>
</body>
</html>
