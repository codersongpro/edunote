<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduNote 채팅방</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard, sans-serif; margin: 0; background: #FAF9F7; color: #1C1917; }
  #app { max-width: 480px; margin: 0 auto; padding: 16px; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  #closedBanner { display: none; background: #FEF3C7; color: #92400E; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 8px; }
  #nickGate { display: flex; flex-direction: column; gap: 10px; margin-top: 40px; }
  #chatArea { display: none; flex: 1; flex-direction: column; min-height: 0; }
  #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 0; }
  .msg { background: #fff; border: 1px solid #EDE8E1; border-radius: 10px; padding: 8px 12px; max-width: 80%; align-self: flex-start; }
  .msg .sender { font-size: 11px; color: #A8A29E; margin-bottom: 2px; }
  #composer { display: flex; gap: 6px; padding: 8px 0; border-top: 1px solid #EDE8E1; }
  input[type=text] { flex: 1; padding: 10px; border: 1px solid #E7E5E4; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
  button { background: #F59E0B; color: #fff; border: none; border-radius: 8px; padding: 10px 14px; font-size: 14px; cursor: pointer; }
  button:disabled { background: #D6D3D1; cursor: default; }
  #joinError { color: #DC2626; font-size: 13px; min-height: 16px; }
</style>
</head>
<body>
<div id="app">
  <h1>EduNote 채팅방</h1>
  <div id="closedBanner">선생님이 채팅방을 종료했습니다. 더 이상 메시지를 보낼 수 없습니다.</div>
  <div id="nickGate">
    <input type="text" id="nickInput" placeholder="닉네임을 입력하세요" maxlength="20">
    <button id="joinBtn">입장하기</button>
    <p id="joinError"></p>
  </div>
  <div id="chatArea">
    <div id="messages"></div>
    <div id="composer">
      <input type="text" id="textInput" placeholder="메시지를 입력하세요" maxlength="500">
      <button id="sendBtn">전송</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function () {
  var hash = location.hash.replace(/^#/, '');
  var params = new URLSearchParams(hash);
  var roomId = params.get('room');
  var cfgRaw = params.get('cfg');
  var joinError = document.getElementById('joinError');
  var joinBtn = document.getElementById('joinBtn');

  if (!roomId || !cfgRaw) {
    joinError.textContent = '잘못된 접속 주소입니다. QR코드를 다시 스캔해주세요.';
    joinBtn.disabled = true;
    return;
  }

  var config;
  try {
    config = JSON.parse(atob(decodeURIComponent(cfgRaw)));
  } catch (e) {
    joinError.textContent = '접속 정보를 읽을 수 없습니다. QR코드를 다시 스캔해주세요.';
    joinBtn.disabled = true;
    return;
  }

  firebase.initializeApp(config);
  var db = firebase.firestore();
  var roomRef = db.collection('rooms').doc(roomId);
  var messagesRef = roomRef.collection('messages');

  var nickname = '';
  var closed = false;
  var messagesEl = document.getElementById('messages');
  var textInput = document.getElementById('textInput');
  var sendBtn = document.getElementById('sendBtn');
  var closedBanner = document.getElementById('closedBanner');

  function renderMessage(data) {
    var div = document.createElement('div');
    div.className = 'msg';
    var senderEl = document.createElement('div');
    senderEl.className = 'sender';
    senderEl.textContent = data.sender || '익명';
    div.appendChild(senderEl);
    var textEl = document.createElement('div');
    textEl.textContent = data.text || '';
    div.appendChild(textEl);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setClosedState(value) {
    closed = value;
    closedBanner.style.display = closed ? 'block' : 'none';
    textInput.disabled = closed;
    sendBtn.disabled = closed;
  }

  function startListening() {
    roomRef.onSnapshot(function (snap) {
      var data = snap.data();
      setClosedState(!!(data && data.closed));
    });
    messagesRef.orderBy('createdAt', 'asc').onSnapshot(function (snap) {
      messagesEl.innerHTML = '';
      snap.forEach(function (doc) { renderMessage(doc.data()); });
    });
  }

  joinBtn.onclick = function () {
    var val = document.getElementById('nickInput').value.trim();
    if (!val) { joinError.textContent = '닉네임을 입력해주세요.'; return; }
    nickname = val.slice(0, 20);
    document.getElementById('nickGate').style.display = 'none';
    document.getElementById('chatArea').style.display = 'flex';
    startListening();
  };

  function sendText() {
    var text = textInput.value.trim();
    if (!text || closed) return;
    textInput.value = '';
    messagesRef.add({
      sender: nickname,
      text: text,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
  }

  sendBtn.onclick = sendText;
  textInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') sendText();
  });
})();
</script>
</body>
</html>
